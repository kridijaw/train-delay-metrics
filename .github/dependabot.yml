version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned to a `next` dist-tag build on purpose; see docs/web-app.md.
      - dependency-name: "@duckdb/duckdb-wasm"

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    groups:
      bundler-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
